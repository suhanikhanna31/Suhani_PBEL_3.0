name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: "source code/requirements.txt"

      - name: Install dependencies
        working-directory: "source code"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        working-directory: "source code"
        run: pytest tests/ -v

      - name: Smoke-test the full synthetic pipeline
        working-directory: "source code"
        run: python -m src.pipeline

      - name: Smoke-test supervised training + metrics report
        working-directory: "source code"
        run: python -m src.models.supervised.train

      - name: Upload evaluation + governance reports as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: "source code/data/processed/reports/"
          if-no-files-found: warn
